name: Source reader frontend validation
on:
  push:
    branches: [step5-source-reader-20261030]
    paths:
      - source-reader.patch
      - scripts/source_reader_build.py
      - .github/workflows/source-reader.yml
permissions:
  contents: read
concurrency:
  group: step5-source-reader-frontend
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'sansyuan97-code/dify-finish-reason-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - name: Fetch this immutable public build revision
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p scripts
          for file in source-context.tar.xz scripts/source_reader_build.py source-reader.patch; do
            curl --fail --location --proto '=https' --max-time 300 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${file}" -o "$file"
          done
      - name: Verify sources, check frontend, build candidate
        shell: bash
        run: python3 scripts/source_reader_build.py --execute
      - name: Save candidate to the existing owner registry package
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/aca-reader-publish-${GITHUB_RUN_ID}"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_REPOSITORY_OWNER" --password-stdin
          unset GHCR_TOKEN
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dify-finish-reason-candidate:reader-${GITHUB_RUN_ID}"
          docker tag "aca-finish-reason:gh-${GITHUB_RUN_ID}" "$image"
          docker push "$image"
          printf '\nFrontend candidate: `%s`\nNot deployed or published as an application.\n' "$image" >> "$GITHUB_STEP_SUMMARY"
