name: Fixed Dify frontend candidate build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fixed-frontend-build
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'sansyuan97-code/dify-finish-reason-build' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - name: Fetch only this immutable public repository revision
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p scripts
          for file in source-context.tar.xz scripts/cloud_build.py; do
            curl --fail --location --proto '=https' --max-time 300 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${file}" -o "$file"
          done
      - name: Validate and build both official frontend targets
        shell: bash
        run: python3 scripts/cloud_build.py --execute
      - name: Save candidate in the owner's container registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/aca-publish-${GITHUB_RUN_ID}"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_REPOSITORY_OWNER" --password-stdin
          unset GHCR_TOKEN
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dify-finish-reason-candidate:gh-${GITHUB_RUN_ID}"
          docker tag "aca-finish-reason:gh-${GITHUB_RUN_ID}" "$image"
          docker push "$image"
          printf '\nCandidate container: `%s`\nRuntime verification and deployment remain incomplete.\n' "$image" >> "$GITHUB_STEP_SUMMARY"
